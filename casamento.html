<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Convite 💍</title>

<style>
body {
  margin: 0;
  background: #f5f5f5;
  font-family: 'Segoe UI', sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

/* Envelope */
.envelope {
  width: 320px;
  height: 220px;
  background: #fff;
  position: relative;
  border-radius: 12px;
  cursor: pointer;
  overflow: hidden;
  box-shadow: 0 15px 40px rgba(0,0,0,0.1);
}

.flap {
  position: absolute;
  width: 100%;
  height: 100%;
  background: #000;
  clip-path: polygon(0 0, 100% 0, 50% 50%);
  transform-origin: top;
  transition: 1s;
}

.text {
  position: absolute;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
}

/* Aberto */
.envelope.open .flap {
  transform: rotateX(180deg);
}
</style>
</head>

<body>

<div class="envelope" onclick="openInvite()">
  <div class="flap"></div>
  <div class="text">Abrir convite 💌</div>
</div>

<script>
function openInvite() {
  const env = document.querySelector('.envelope');
  env.classList.add('open');

  setTimeout(() => {
    window.location.href = "evento.html";
  }, 1000);
}
</script>

</body>
</html>
